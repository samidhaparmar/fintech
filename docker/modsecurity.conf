<IfModule security2_module>
    # 1. Turn ModSecurity ON (block mode)
    SecRuleEngine On

    # 2. Only log transactions that hit a rule
    SecAuditEngine RelevantOnly

    # 3. Where to write detailed audit logs
    SecAuditLog /var/log/apache2/modsec_audit.log

    # 4. Load the Core Rule Set configuration
    IncludeOptional /etc/modsecurity-crs/crs-setup.conf

    # 5. Include all CRS rule files
    IncludeOptional /etc/modsecurity-crs/rules/*.conf
</IfModule>